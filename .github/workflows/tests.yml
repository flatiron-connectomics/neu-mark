name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.12 is what the shared neu-env environment uses; 3.11 is the floor
        # pyproject declares, and testing it is what keeps that honest.
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v7

      # Sibling packages, not on PyPI. All are public, so no token is needed — but pip
      # would still try PyPI for the `neu-vol` requirement, so they have to be
      # installed from source FIRST, and in dependency order.
      - uses: actions/checkout@v7
        with:
          repository: flatiron-connectomics/neu-lib
          path: .siblings/neu-lib

      - uses: actions/checkout@v7
        with:
          repository: flatiron-connectomics/blockrun
          path: .siblings/blockrun

      - uses: actions/checkout@v7
        with:
          repository: flatiron-connectomics/neu-vol
          path: .siblings/neu-vol

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # No conda, and that is deliberate: `neuclease` is conda-only on flyem-forge (it
      # needs libdvid-cpp, vigra and dvidutils), so a conda job would be far slower for
      # no gain here. Every test that talks to DVID guards its fixture with
      # `pytest.importorskip("neuclease")` and SKIPS — measured 126 passed, 84 skipped.
      # That still covers the parts most likely to break silently: the table model and its
      # axis order, the label-string parsing, the rule framework, the config search, and
      # the CLI's argument contract.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install ./.siblings/neu-lib ./.siblings/blockrun ./.siblings/neu-vol
          pip install -e ".[dev]"

      - name: Test
        shell: bash
        run: |
          set -o pipefail
          pytest -q | tee /tmp/pytest.out
          # pytest already fails on an ERROR, which is what a fixture importing neuclease
          # WITHOUT `pytest.importorskip` produces — the bug that turned neu-vol'
          # CI red the first time it ran. This catches the opposite surprise: the DVID
          # tests quietly not running at all, which would look like a clean pass.
          grep -qE '[0-9]+ skipped' /tmp/pytest.out || {
            echo "::error::no tests were skipped — the DVID suite is expected to skip here, so either neuclease got installed or those tests stopped being collected"
            exit 1
          }

      - name: Smoke-test the installed console script
        # The suite runs from a source tree, so it cannot catch a packaging fault that
        # only shows up once installed — which is the whole reason this package has a CLI.
        # Run it from a directory with no checkout in sight.
        run: |
          pip install build
          python -m build --wheel -o dist/
          pip install --force-reinstall --no-deps dist/*.whl
          cd /tmp && neu-mark --help > /dev/null
          cd /tmp && neu-mark select-bodies --help > /dev/null
          cd /tmp && python -c "
          import neu_mark, sys
          # The lazy top-level exports must not drag pandas in: `cli` reads __version__
          # from __init__, so an eager import there would slow every `--help`.
          assert 'pandas' not in sys.modules, 'importing neu_mark pulled in pandas'
          assert hasattr(neu_mark, 'select_bodies')
          print('lazy exports resolve; version', neu_mark.__version__)
          "

  # Ask the documentation site to rebuild, so the published CLI reference follows this
  # commit. `main` only, and only once the tests pass: the reference is generated from the
  # live parsers, so publishing from a red commit would document code nobody should run.
  docs:
    needs: pytest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Rebuild flatiron-connectomics/neu-suite
        env:
          # The workflow's own GITHUB_TOKEN is scoped to THIS repository and cannot
          # dispatch to another one, so this needs a separate token with contents:write on
          # neu-suite. When it is absent the step says so and succeeds — a docs refresh
          # that did not happen must not turn a green test run red, and the site rebuilds
          # on its nightly schedule regardless.
          TOKEN: ${{ secrets.DOCS_DISPATCH_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::notice::DOCS_DISPATCH_TOKEN is not set; skipping. The site will pick this commit up on its next scheduled build."
            exit 0
          fi
          code=$(curl -sS -o /dev/null -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/flatiron-connectomics/neu-suite/dispatches \
            -d "{\"event_type\":\"package-updated\",\"client_payload\":{\"repo\":\"$GITHUB_REPOSITORY\",\"sha\":\"$GITHUB_SHA\"}}" || echo 000)
          if [ "$code" = "204" ]; then
            echo "::notice::asked neu-suite to rebuild its docs for $GITHUB_SHA"
          else
            echo "::warning::docs dispatch returned HTTP $code; the site rebuilds on its own schedule instead. A 403 means DOCS_DISPATCH_TOKEN lacks contents:write on flatiron-connectomics/neu-suite — note that a fine-grained token pinned to a repo does NOT follow a delete-and-recreate, since the new repo has a new id."
          fi
